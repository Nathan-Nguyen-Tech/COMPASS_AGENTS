        .dashboard-header {

            font-weight: 600;

        }

        .btn-apply-filter:hover {

        .btn-refresh {

        // Toggle month/quarter filters
        document.getElementById('dashboardType').addEventListener('change', function() {
            const type = this.value;
            const monthContainer = document.getElementById('monthFilterContainer');
            const quarterContainer = document.getElementById('quarterFilterContainer');

            if (type === 'monthly') {
                monthContainer.style.display = 'block';
                quarterContainer.style.display = 'none';
            } else {
                monthContainer.style.display = 'none';
                quarterContainer.style.display = 'block';
            }
        });

        // API base URL (change if server runs on different port)
        const API_BASE = window.location.origin.includes('localhost:5000') ?
                         'http://localhost:5000' : '';

        // Show loading overlay
        function showLoading(message) {
            let overlay = document.getElementById('loadingOverlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'loadingOverlay';
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.8);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 9999;
                    color: white;
                    font-size: 1.5rem;
                    font-weight: 600;
                `;
                document.body.appendChild(overlay);
            }
            overlay.innerHTML = `
                <div style="text-align: center;">
                    <div class="spinner-border text-light mb-3" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <div>${message}</div>
                </div>
            `;
            overlay.style.display = 'flex';
        }

        // Hide loading overlay
        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        // Check generation status and reload when done
        function checkGenerationStatus(intervalId) {
            fetch(`${API_BASE}/api/status`)
                .then(response => response.json())
                .then(status => {
                    if (status.is_generating) {
                        showLoading(status.progress || 'Generating dashboard...');
                    } else {
                        clearInterval(intervalId);
                        if (status.error) {
                            hideLoading();
                            alert('Error: ' + status.error);
                        } else {
                            // Success - reload page to show new dashboard
                            showLoading('Dashboard generated! Reloading...');
                            setTimeout(() => {
                                window.location.reload();
                            }, 1000);
                        }
                    }
                })
                .catch(error => {
                    clearInterval(intervalId);
                    hideLoading();
                    console.error('Status check failed:', error);
                });
        }

        // Apply filters function

            const year = document.getElementById('yearFilter').value;

            // Build request body
            const requestBody = { type };
            if (year) requestBody.year = parseInt(year);
            if (type === 'monthly' && month) requestBody.month = parseInt(month);
            if (type === 'quarterly' && quarter) requestBody.quarter = parseInt(quarter);

            try {
                showLoading('Starting dashboard generation...');

                const response = await fetch(`${API_BASE}/api/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();

                if (result.success) {
                    // Start polling for status
                    const intervalId = setInterval(() => checkGenerationStatus(intervalId), 2000);
                } else {
                    hideLoading();
                    alert('Error: ' + (result.error || 'Failed to start generation'));
                }
            } catch (error) {
                hideLoading();
                alert('Error calling API: ' + error.message +
                      '\n\nMake sure the API server is running:\npython tools/scripts/dashboard_api_server.py');
            }
        }

        // Refresh data function
        async function refreshData() {
            const type = document.getElementById('dashboardType').value;
            const year = document.getElementById('yearFilter').value;
            const month = document.getElementById('monthFilter').value;
            const quarter = document.getElementById('quarterFilter').value;

            if (!confirm('This will fetch fresh data from Google Sheets. Continue?')) {
                return;
            }

            // Build request body
            const requestBody = { type };
            if (year) requestBody.year = parseInt(year);
            if (type === 'monthly' && month) requestBody.month = parseInt(month);
            if (type === 'quarterly' && quarter) requestBody.quarter = parseInt(quarter);

            try {
                showLoading('Fetching data from Google Sheets...');

                const response = await fetch(`${API_BASE}/api/refresh`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();

                if (result.success) {
                    // Start polling for status
                    const intervalId = setInterval(() => checkGenerationStatus(intervalId), 2000);
                } else {
                    hideLoading();
                    alert('Error: ' + (result.error || 'Failed to start refresh'));
                }
            } catch (error) {
                hideLoading();
                alert('Error calling API: ' + error.message +
                      '\n\nMake sure the API server is running:\npython tools/scripts/dashboard_api_server.py');
            }
        }

        // Render charts on page load
        window.addEventListener('load', function() {
            renderCharts();
        });

        // Make charts responsive
        window.addEventListener('resize', function() {
            Plotly.Plots.resize('chart1');
            Plotly.Plots.resize('chart2');
            Plotly.Plots.resize('chart3');
            Plotly.Plots.resize('chart4');
            Plotly.Plots.resize('chart5');
            Plotly.Plots.resize('chart6');
            Plotly.Plots.resize('chart7');
            Plotly.Plots.resize('chart8');
            Plotly.Plots.resize('chart9');
        });
    </script>
